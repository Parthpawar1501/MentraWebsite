name: Deploy to Shopify Oxygen

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_STOREFRONT_API_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_API_TOKEN }}
          SHOPIFY_STOREFRONT_API_VERSION: ${{ secrets.SHOPIFY_STOREFRONT_API_VERSION || '2024-01' }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      - name: Deploy to Oxygen
        run: |
          if [ -n "${{ secrets.SHOPIFY_CLI_TOKEN }}" ]; then
            npm install -g @shopify/cli @shopify/theme
            shopify hydrogen deploy
          else
            echo "SHOPIFY_CLI_TOKEN not set, skipping deployment"
            echo "Build completed successfully. Deploy manually with: shopify hydrogen deploy"
          fi
        env:
          SHOPIFY_CLI_TOKEN: ${{ secrets.SHOPIFY_CLI_TOKEN }}
